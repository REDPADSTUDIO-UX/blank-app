name: Video Studio smoke test

on:
  push:
    branches:
      - feature/video-music-editing-studio
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile app and video module
        run: python -m compileall -q streamlit_app.py redpad_video_studio.py redpad_pipeline

      - name: Render and validate a demo MP4
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from redpad_video_studio import ffmpeg_binary, render_mp4

          ff = ffmpeg_binary()
          assert ff, "FFmpeg is unavailable"
          output_dir = Path("ci_artifacts")
          output_dir.mkdir(exist_ok=True)
          mp4 = output_dir / "redpad-video-demo.mp4"
          result = render_mp4("CI horror demo", "A short Bengali video studio test", mp4, portrait=True)
          assert mp4.is_file() and mp4.stat().st_size > 3000, "MP4 missing or empty"
          assert result["seconds"] == 30.0, "Unexpected duration"
          assert not result["voice"], "Test should not require narration credentials"
          inspection = subprocess.run([ff, "-hide_banner", "-i", str(mp4)], text=True, capture_output=True, timeout=30)
          assert "Video:" in inspection.stderr and "Audio:" in inspection.stderr, "Missing MP4 video or audio"
          print("PASS: 30-second demo video and soundtrack encoded", mp4.stat().st_size, "bytes")
          PY

      - name: Test Streamlit app and Video Studio UI
        run: python tests/smoke_streamlit_ui.py

      - name: Test narration mixing and duration validation
        run: python tests/test_renderer.py

      - name: Test production providers, paid-call guards, checkpoints and real editing
        run: python tests/test_production_pipeline.py

      - name: Test multi-model selection and budget controls (offline)
        run: python -m unittest tests/test_multi_model.py -v

      - name: Test private Render dashboard login
        run: python tests/test_private_preview.py

      - name: Test production UI and bilingual approval integration
        run: python tests/test_production_ui.py

      - name: Test offline Storyboard Studio versioning, sketches and approval
        run: python tests/test_storyboard.py

      - name: Render approved storyboard to an offline MP4 with Bangla captions
        run: python tests/test_storyboard_render.py

      - name: Verify approved storyboard to Live AI scene plans and image-to-video mocks
        run: python -m unittest tests/test_storyboard_live.py -v

      - name: Test YouTube OAuth, approval and scheduling without Google requests
        run: python tests/test_youtube.py

      - name: Test YouTube Connect dashboard with a real offline MP4
        run: python tests/test_youtube_ui.py

      - name: Save demo MP4 for download
        uses: actions/upload-artifact@v6
        with:
          name: redpad-video-demo
          path: |
            ci_artifacts/*.mp4
            ci_artifacts/*.srt
          if-no-files-found: error
          retention-days: 7

  browser-smoke-test:
    # Match the pinned browser runtime to a supported OS, rather than moving latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install app and browser test dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test real browser UI without secrets or paid requests
        run: python tests/browser_smoke.py
      - name: Save actual dashboard screenshots and downloaded mock MP4
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: redpad-browser-preview
          path: ci_artifacts/
          if-no-files-found: warn
          retention-days: 7
