name: Phase 2 approved public runtime acceptance

on:
  push:
    branches: [feature/video-music-editing-studio]
    paths:
      - '.github/workflows/phase2-public-runtime.yml'
      - 'experiments/phase2_*.py'
      - 'redpad_pipeline/fp8_preflight.py'
      - 'redpad_pipeline/wan_distilled_preparation.py'

permissions:
  contents: read

concurrency:
  group: phase2-public-runtime
  cancel-in-progress: false

jobs:
  secure-new-cpu-runtimes:
    if: ${{ github.event.repository.private == false && contains(github.event.head_commit.message, '[phase2-runtime-only]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.18'
      - name: Verify this ephemeral host before large dependency acquisition
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends bubblewrap
          mkdir -p "$RUNNER_TEMP/phase2-results"
          python -B verification/kernel_phase1_20261121/probe.py | tee "$RUNNER_TEMP/phase2-results/host-isolation.log"
      - name: Acquire exact approved public dependencies and source only
        run: |
          set -euo pipefail
          python -B experiments/phase2_offline_wheels.py \
            --manifest verification/phase2_cpu_gaps_20261122/qwen-platform-wheels.json \
            --lock verification/phase2_cpu_gaps_20261122/qwen-candidate.lock \
            --wheelhouse "$RUNNER_TEMP/phase2-wheels" \
            --receipt "$RUNNER_TEMP/phase2-results/wheel-acquisition.json"
          python -B experiments/phase2_public_sources.py "$RUNNER_TEMP/phase2-sources" \
            > "$RUNNER_TEMP/phase2-results/source-receipt.json"
      - name: Offline materialized prefix and dependency closure
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/phase2-install-tmp"
          mkdir -p "$TMPDIR" "$RUNNER_TEMP/phase2-prefix"
          base=$(python -c 'import sys; print(sys.base_prefix)')
          cp -aL "$base/." "$RUNNER_TEMP/phase2-prefix/"
          python -m pip install --prefix "$RUNNER_TEMP/phase2-prefix" \
            --no-index --find-links "$RUNNER_TEMP/phase2-wheels" \
            --only-binary=:all: --require-hashes --no-compile --ignore-installed \
            -r verification/phase2_resume_20261122/selected-wheels.lock
          "$RUNNER_TEMP/phase2-prefix/bin/python3.11" -B -m pip check
          find "$RUNNER_TEMP/phase2-prefix" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/phase2-prefix" -type f -name '*.pyc' -delete
      - name: New profile contracts and real model-free isolated startup
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_phase2_offline_acquisition
          python -B experiments/phase2_secure_cpu_probe.py \
            "$RUNNER_TEMP/phase2-prefix" "$RUNNER_TEMP/phase2-sources" \
            "$RUNNER_TEMP/phase2-results/source-receipt.json" "$RUNNER_TEMP/phase2-results" \
            | tee "$RUNNER_TEMP/phase2-results/secure-startup.log"
      - name: Preserve only lightweight diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase2-approved-public-runtime-receipts
          path: ${{ runner.temp }}/phase2-results/
          if-no-files-found: error
          retention-days: 14
